<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="woodShelf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a3525"/>
      <stop offset="100%" stop-color="#2d1f14"/>
    </linearGradient>
    <linearGradient id="steelGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d4dbe0"/>
      <stop offset="50%" stop-color="#93a0a8"/>
      <stop offset="100%" stop-color="#58636b"/>
    </linearGradient>
    <linearGradient id="brassGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f7e199"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#917319"/>
    </linearGradient>
  </defs>

  <!-- Dark Atmospheric Workshop Background -->
  <rect width="800" height="600" fill="#181512"/>

  <!-- Wooden Shelving System -->
  <!-- Top Shelf -->
  <rect x="40" y="80" width="720" height="24" fill="url(#woodShelf)" stroke="#1a1109" stroke-width="2"/>
  <rect x="40" y="104" width="720" height="8" fill="#1e140d"/>
  <!-- Middle Shelf -->
  <rect x="40" y="270" width="720" height="24" fill="url(#woodShelf)" stroke="#1a1109" stroke-width="2"/>
  <rect x="40" y="294" width="720" height="8" fill="#1e140d"/>
  <!-- Bottom Bench -->
  <rect x="40" y="470" width="720" height="30" fill="url(#woodShelf)" stroke="#1a1109" stroke-width="2"/>

  <!-- Top Shelf Items: Vintage Wooden Boxes of Fasteners with Handwritten Price Tags -->
  <g id="boxesTop">
    <!-- Box 1 -->
    <rect x="70" y="30" width="90" height="50" fill="#b08453" stroke="#694b29" stroke-width="2"/>
    <rect x="78" y="45" width="45" height="25" fill="#faf5e6" stroke="#444" stroke-width="1"/>
    <text x="82" y="62" font-family="'Courier New', monospace" font-size="12" font-weight="900" fill="#222">2" NAILS</text>
    <!-- Box 2 -->
    <rect x="180" y="20" width="110" height="60" fill="#8c6439" stroke="#54391b" stroke-width="2"/>
    <rect x="195" y="45" width="55" height="25" fill="#faf5e6" stroke="#444" stroke-width="1"/>
    <text x="200" y="62" font-family="'Courier New', monospace" font-size="11" font-weight="900" fill="#222">BRASS 1/2</text>
    <!-- Box 3 -->
    <rect x="310" y="35" width="100" height="45" fill="#a67946" stroke="#694b29" stroke-width="2"/>
    <text x="330" y="62" font-family="'Courier New', monospace" font-size="11" font-weight="900" fill="#222">SPANNERS</text>
    <!-- Coil of Natural Twine / Rope -->
    <ellipse cx="480" cy="50" rx="35" ry="30" fill="#c2ad83" stroke="#8a754e" stroke-width="4"/>
    <ellipse cx="480" cy="50" rx="15" ry="12" fill="#181512"/>
    <!-- Vintage Oil Can -->
    <path d="M 580,75 L 610,75 L 605,35 L 585,35 Z" fill="#b8382c" stroke="#661810" stroke-width="2"/>
    <path d="M 595,35 L 625,10" stroke="#b8382c" stroke-width="4" stroke-linecap="round"/>
    <!-- Heavy Duty Rubber Boots Silhouette -->
    <path d="M 660,75 L 675,75 L 685,55 L 680,20 L 665,20 L 665,55 Z" fill="#243329" stroke="#121a15" stroke-width="2"/>
    <path d="M 685,75 L 700,75 L 710,55 L 705,20 L 690,20 L 690,55 Z" fill="#243329" stroke="#121a15" stroke-width="2"/>
  </g>

  <!-- Middle Shelf Items: Tools of the Trade -->
  <g id="toolsMiddle">
    <!-- Big Vintage Hand Saw -->
    <g transform="translate(80, 160)">
      <path d="M 30,30 L 220,10 L 220,70 L 30,50 Z" fill="url(#steelGrad)" stroke="#444" stroke-width="1.5"/>
      <!-- Saw Teeth -->
      <path d="M 30,50 L 220,70" stroke="#222" stroke-width="3" stroke-dasharray="4,4"/>
      <!-- Wooden Handle -->
      <path d="M 10,25 C 0,35 0,55 10,65 L 35,55 L 35,25 Z" fill="#a06030" stroke="#502a0a" stroke-width="2"/>
      <circle cx="20" cy="45" r="8" fill="#181512"/>
    </g>

    <!-- Claw Hammer -->
    <g transform="translate(340, 200) rotate(-15)">
      <rect x="0" y="8" width="160" height="14" rx="4" fill="#d99b64" stroke="#7a4d23" stroke-width="2"/>
      <path d="M 130,-10 C 160,-20 180,-15 190,0 L 160,0 L 160,30 L 140,30 L 140,0 Z" fill="url(#steelGrad)" stroke="#444" stroke-width="2"/>
    </g>

    <!-- Vintage Heavy Adjustable Spanner / Wrench -->
    <g transform="translate(560, 210) rotate(20)">
      <rect x="0" y="6" width="150" height="12" rx="4" fill="url(#steelGrad)" stroke="#333" stroke-width="2"/>
      <!-- Wrench head -->
      <path d="M 130,-8 C 145,-15 170,-10 170,10 L 155,10 L 155,20 L 170,20 C 170,40 145,45 130,38 Z" fill="url(#steelGrad)" stroke="#333" stroke-width="2"/>
      <circle cx="15" cy="12" r="6" fill="none" stroke="#333" stroke-width="3"/>
    </g>
  </g>

  <!-- Bottom Bench Items: The Convergence of Beer & Hardware! -->
  <g id="bottomBench">
    <!-- Pints of Stout alongside tools! -->
    <!-- Authentic Imperial Pint of Guinness -->
    <g transform="translate(240, 360)">
      <path d="M 0,0 L 8,95 Q 8,105 18,105 Q 28,105 28,95 L 36,0 Z" fill="#120f0c" stroke="rgba(255,255,255,0.4)" stroke-width="1.5"/>
      <path d="M -2,0 Q 18,-6 38,0 L 37,18 Q 18,14 -1,18 Z" fill="#faf5e6"/>
      <ellipse cx="18" cy="0" rx="20" ry="4" fill="#fffefc"/>
    </g>

    <!-- Open Toolbox with Screws and Nails Spilling Out -->
    <g transform="translate(320, 390)">
      <rect x="0" y="30" width="180" height="70" rx="4" fill="#2d5238" stroke="#173120" stroke-width="3"/>
      <rect x="10" y="10" width="160" height="20" fill="#1e3a26" stroke="#173120" stroke-width="2"/>
      <!-- Metal latch -->
      <rect x="80" y="25" width="20" height="25" fill="url(#brassGrad)" stroke="#6d5415" stroke-width="1.5"/>
      <!-- Scattered nuts, bolts, screws -->
      <circle cx="-15" cy="90" r="5" fill="url(#brassGrad)"/>
      <circle cx="-35" cy="92" r="6" fill="url(#steelGrad)"/>
      <line x1="-50" y1="88" x2="-35" y2="98" stroke="url(#steelGrad)" stroke-width="3"/>
      <line x1="-20" y1="92" x2="-5" y2="85" stroke="url(#brassGrad)" stroke-width="2.5"/>
    </g>

    <!-- Bicycle Puncture Repair Kit -->
    <g transform="translate(560, 420)">
      <rect x="0" y="0" width="95" height="55" rx="6" fill="#f0a500" stroke="#996300" stroke-width="2"/>
      <text x="47" y="24" font-family="'Inter', sans-serif" font-size="10" font-weight="900" fill="#222" text-anchor="middle">PUNCTURE</text>
      <text x="47" y="38" font-family="'Inter', sans-serif" font-size="9" font-weight="800" fill="#222" text-anchor="middle">REPAIR KIT</text>
      <circle cx="20" cy="46" r="3" fill="#b02a2a"/>
      <circle cx="75" cy="46" r="3" fill="#b02a2a"/>
    </g>
  </g>

  <!-- Banner Headline Overlay -->
  <rect x="150" y="520" width="500" height="50" rx="25" fill="#143425" stroke="#d4af37" stroke-width="2"/>
  <text x="400" y="552" font-family="'Playfair Display', serif" font-size="20" font-weight="700" fill="#f5d77f" text-anchor="middle" letter-spacing="2">
    "A Pint Along With A New Spanner"
  </text>
</svg>