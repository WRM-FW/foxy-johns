<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="peninsulaSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3d6b8c"/>
      <stop offset="60%" stop-color="#7ca7c7"/>
      <stop offset="100%" stop-color="#d6e8f5"/>
    </linearGradient>
    <linearGradient id="atlanticSea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1b4d66"/>
      <stop offset="100%" stop-color="#0d2b3b"/>
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="800" height="360" fill="url(#peninsulaSky)"/>
  <!-- Atlantic Ocean & Dingle Bay -->
  <rect y="320" width="800" height="120" fill="url(#atlanticSea)"/>
  <!-- Slea Head Cliffs & Coastline -->
  <path d="M 0,280 Q 150,220 300,260 T 600,200 T 800,240 L 800,380 L 0,380 Z" fill="#2d5234"/>
  <path d="M 0,330 Q 200,290 400,320 T 800,280 L 800,420 L 0,420 Z" fill="#3b6943"/>

  <!-- Coastal Road (Slea Head Drive) -->
  <rect y="400" width="800" height="200" fill="#4d5357"/>
  <line x1="0" y1="500" x2="800" y2="500" stroke="#f0d060" stroke-width="4" stroke-dasharray="40,30"/>

  <!-- Touring Bicycle Illustration -->
  <g id="touringBike" transform="translate(400, 420)">
    <!-- Wheels -->
    <!-- Rear Wheel -->
    <circle cx="-160" cy="0" r="85" fill="none" stroke="#222" stroke-width="12"/>
    <circle cx="-160" cy="0" r="79" fill="none" stroke="#888" stroke-width="3"/>
    <circle cx="-160" cy="0" r="10" fill="#555"/>
    <!-- Front Wheel -->
    <circle cx="160" cy="0" r="85" fill="none" stroke="#222" stroke-width="12"/>
    <circle cx="160" cy="0" r="79" fill="none" stroke="#888" stroke-width="3"/>
    <circle cx="160" cy="0" r="10" fill="#555"/>
    <!-- Spokes simplified -->
    <line x1="-160" y1="-75" x2="-160" y2="75" stroke="#aaa" stroke-width="1.5"/>
    <line x1="-235" y1="0" x2="-85" y2="0" stroke="#aaa" stroke-width="1.5"/>
    <line x1="160" y1="-75" x2="160" y2="75" stroke="#aaa" stroke-width="1.5"/>
    <line x1="85" y1="0" x2="235" y2="0" stroke="#aaa" stroke-width="1.5"/>

    <!-- Bicycle Frame (British Racing Green) -->
    <!-- Bottom Bracket -->
    <circle cx="-20" cy="0" r="14" fill="#333"/>
    <!-- Chainstay -->
    <line x1="-160" y1="0" x2="-20" y2="0" stroke="#164d36" stroke-width="9"/>
    <!-- Seatstay -->
    <line x1="-160" y1="0" x2="-55" y2="-95" stroke="#164d36" stroke-width="8"/>
    <!-- Seat Tube -->
    <line x1="-20" y1="0" x2="-55" y2="-95" stroke="#164d36" stroke-width="9"/>
    <!-- Down Tube -->
    <line x1="-20" y1="0" x2="105" y2="-85" stroke="#164d36" stroke-width="10"/>
    <!-- Top Tube -->
    <line x1="-55" y1="-95" x2="105" y2="-85" stroke="#164d36" stroke-width="9"/>
    <!-- Head Tube -->
    <line x1="105" y1="-85" x2="120" y2="-120" stroke="#164d36" stroke-width="10"/>
    <!-- Front Fork -->
    <line x1="105" y1="-85" x2="160" y2="0" stroke="#164d36" stroke-width="8"/>

    <!-- Saddle & Seatpost -->
    <line x1="-55" y1="-95" x2="-62" y2="-125" stroke="#888" stroke-width="6"/>
    <path d="M -90,-125 C -90,-135 -40,-135 -35,-125 C -45,-122 -75,-122 -90,-125 Z" fill="#4a2c14" stroke="#291607" stroke-width="2"/>

    <!-- Handlebars & Stem -->
    <line x1="120" y1="-120" x2="115" y2="-145" stroke="#888" stroke-width="6"/>
    <path d="M 115,-145 Q 130,-155 145,-140 Q 155,-120 135,-110" fill="none" stroke="#222" stroke-width="6" stroke-linecap="round"/>

    <!-- Pedals & Chainring -->
    <circle cx="-20" cy="0" r="20" fill="none" stroke="#d4af37" stroke-width="3"/>
    <line x1="-20" y1="0" x2="-10" y2="24" stroke="#888" stroke-width="5"/>
    <rect x="-18" y="24" width="16" height="6" rx="2" fill="#222"/>

    <!-- Touring Rear Pannier Bag -->
    <rect x="-140" y="-80" width="60" height="70" rx="6" fill="#8c6439" stroke="#52391d" stroke-width="2.5"/>
    <rect x="-145" y="-85" width="70" height="15" rx="3" fill="#694b29"/>
    <rect x="-115" y="-55" width="10" height="18" fill="#d4af37"/>
  </g>

  <!-- Road Sign: SLEA HEAD DRIVE -->
  <g transform="translate(680, 360)">
    <rect x="0" y="0" width="90" height="55" rx="4" fill="#0b5e34" stroke="#fff" stroke-width="2.5"/>
    <text x="45" y="22" font-family="'Inter', sans-serif" font-size="10" font-weight="900" fill="#fff" text-anchor="middle">CEANN SLÉIBHE</text>
    <text x="45" y="38" font-family="'Inter', sans-serif" font-size="10" font-weight="800" fill="#f0d060" text-anchor="middle">SLEA HEAD</text>
    <line x1="45" y1="55" x2="45" y2="150" stroke="#777" stroke-width="6"/>
  </g>

  <!-- Banner -->
  <rect x="150" y="525" width="500" height="48" rx="24" fill="#143425" stroke="#d4af37" stroke-width="2"/>
  <text x="400" y="555" font-family="'Playfair Display', serif" font-size="19" font-weight="700" fill="#f5d77f" text-anchor="middle" letter-spacing="2">
    Bicycle Hire for the Wild Atlantic Way
  </text>
</svg>